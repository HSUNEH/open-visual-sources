<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Play · Open Visuals</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#13294f}#scene{display:block;width:100%;height:100%;touch-action:none}#app{display:none!important}</style>
</head><body><canvas id="scene" aria-label="벡터장을 따라 흐르는 입자"></canvas><div id="app"></div>
<script>
  // Exhibition shell only: no upstream analytics, microphone UI or site chrome.
  window.addEventListener('wheel',event=>{if(event.ctrlKey)return;event.preventDefault();event.stopImmediatePropagation();parent.dispatchEvent(new CustomEvent('exhibit-wheel',{detail:{x:event.deltaX,y:event.deltaY,mode:event.deltaMode,shift:event.shiftKey}}));},{capture:true,passive:false});
  window.addEventListener('keydown',event=>{if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Escape',' '].includes(event.key)){event.preventDefault();event.stopImmediatePropagation();parent.dispatchEvent(new KeyboardEvent('keydown',{key:event.key,code:event.code}));}},true);
</script>
